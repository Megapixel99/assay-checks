[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "assay-checks"
version = "0.3.1"
description = "Audit the checks, and find the answers your tree already has: could those tests have failed, and does the tree already answer this?"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
keywords = [
    "audit", "mutation-testing", "duplication", "code-quality", "test-quality",
    "differential-testing", "static-analysis", "ci",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]

# NO DEPENDENCIES, and that is a design constraint rather than an accident. This runs
# in CI, before and beside your test suite, on whatever interpreter is already there.
# A quality tool that drags in a dependency tree is one more thing that can break the
# build it was added to protect.
dependencies = []

[project.scripts]
assay = "assay.cli:main"

[project.urls]
Homepage = "https://github.com/Megapixel99/assay-checks"
Source = "https://github.com/Megapixel99/assay-checks"
Changelog = "https://github.com/Megapixel99/assay-checks/blob/master/CHANGELOG.md"
Issues = "https://github.com/Megapixel99/assay-checks/issues"

# The package LIVES in `python/` and is IMPORTED as `assay`, and those are two
# different names on purpose. The directory sits beside `js/` so the two halves are
# findable in the same shape; the import name is what `pip install assay-checks` has
# already published, and renaming that would break `import assay`, `python3 -m assay`
# and the `assay` console script for everyone who has it.
[tool.setuptools]
package-dir = { "" = "python" }
packages = ["assay"]

[tool.setuptools.package-data]
assay = ["py.typed"]
