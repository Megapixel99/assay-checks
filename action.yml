name: assay
description: >-
  Audit the checks, and find the answers your tree already has — could those tests have
  failed, and does the tree already answer this?
author: Seth Wheeler

branding:
  icon: check-circle
  color: purple

inputs:
  command:
    description: >-
      runners | anchors | diff | all | scan | pair | search | why | probe | cross |
      bundle | sweep. `all` is the usual choice for a pull request. `accept` is
      deliberately absent: it WRITES to assay.json, and a CI job that edits its own
      config is a job whose record nobody read.
    required: false
    default: all
  paths:
    description: >-
      Paths for `scan`, `bundle` and `sweep`, the FILE::NAME references for `pair`,
      `search`, `why`, `probe` and `cross`, or — with `all` — the paths to fold the
      sameness half in over, which is what makes that run COMPLETE enough to call a
      baseline line stale.
    required: false
    default: ''
  against:
    description: >-
      For `sweep`: the OTHER half's `assay bundle` document, or its paths when `with`
      is given. Required by `sweep` and ignored by everything else.
    required: false
    default: ''
  with:
    description: >-
      For `sweep` and `cross`: the command that runs the OTHER half, e.g. `assay-js`.
      Both packages install a binary called `assay`, so this is named rather than
      guessed — a half that guessed would run itself and compare a tree with itself.
    required: false
    default: ''
  root:
    description: Project root to audit.
    required: false
    default: '.'
  base:
    description: >-
      Ref to diff against for `diff` and `all`. Defaults to the pull request's base
      branch, which is the ref that makes `diff` mean anything.
    required: false
    default: ''
  config:
    description: Path to assay.json. Found in `root` when not given.
    required: false
    default: ''
  language:
    description: python | node — which implementation to run.
    required: false
    default: python
  fail-on-findings:
    description: >-
      Fail the step when there are findings. Set to `false` to report without gating,
      which is the honest way to adopt this on a project that starts with a backlog —
      though a baseline in assay.json is better, because it fails on anything NEW.
    required: false
    default: 'true'

outputs:
  findings:
    description: Number of findings, 0 when clean.
    value: ${{ steps.assay.outputs.findings }}

runs:
  using: composite
  steps:
    # `diff` compares against a base ref, and a shallow checkout does not have one.
    # Without this the tool reports "cannot diff against <ref>" — which is at least
    # honest, but it is a wasted run. Checking here means the failure names the cause.
    - name: the checkout must have history for `diff`
      if: inputs.command == 'diff' || inputs.command == 'all'
      shell: bash
      run: |
        cd "${{ inputs.root }}"
        if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
          echo "::warning::this checkout is shallow, so \`assay diff\` has no base to"
          echo "::warning::compare against. Add \`fetch-depth: 0\` to actions/checkout."
        fi

    - name: run assay
      id: assay
      shell: bash
      env:
        ASSAY_HOME: ${{ github.action_path }}
      run: |
        set -o pipefail
        base="${{ inputs.base }}"
        if [ -z "$base" ] && [ -n "${{ github.base_ref }}" ]; then
          base="origin/${{ github.base_ref }}"
        fi
        args=()
        [ -n "${{ inputs.root }}" ] && args+=(--root "${{ inputs.root }}")
        [ -n "${{ inputs.config }}" ] && args+=(--config "${{ inputs.config }}")
        args+=("${{ inputs.command }}")
        case "${{ inputs.command }}" in
          diff|all) [ -n "$base" ] && args+=(--base "$base") ;;
        esac
        # `sweep` cannot run without a far side, and the two flags that name one are
        # passed through rather than inferred. An empty `against` reaching the tool is
        # an exit 2 that says what is missing, which is the right failure: a step that
        # quietly swept nothing would report a clean audit for a comparison it never
        # made.
        [ -n "${{ inputs.against }}" ] && args+=(--against ${{ inputs.against }})
        [ -n "${{ inputs.with }}" ] && args+=(--with "${{ inputs.with }}")
        # WITH `all`, PATHS MEAN `--scan`. `all` takes no positional arguments, and
        # without the sameness half the run has not performed every audit able to
        # produce a baseline line — so an untagged accepted finding can be fixed and
        # its record left behind forever, which is the thing the baseline exists to
        # stop. Every other command takes them as positionals.
        if [ -n "${{ inputs.paths }}" ]; then
          if [ "${{ inputs.command }}" = "all" ]; then
            args+=(--scan ${{ inputs.paths }})
          else
            args+=(${{ inputs.paths }})
          fi
        fi

        if [ "${{ inputs.language }}" = "node" ]; then
          node "$ASSAY_HOME/js/src/cli.js" "${args[@]}" | tee assay-output.txt
        else
          PYTHONPATH="$ASSAY_HOME/python" python3 -m assay "${args[@]}" | tee assay-output.txt
        fi
        # The exit code is the tool's verdict and `tee` would otherwise hide it behind
        # its own. 0 = nothing to read, 1 = findings, 2 = could not run.
        status=${PIPESTATUS[0]}
        findings=$(grep -c '^  finding  ' assay-output.txt || true)
        echo "findings=$findings" >> "$GITHUB_OUTPUT"

        # 2 is never suppressible. "The tool could not run" and "the tool found
        # nothing" are opposite situations, and letting the second silence the first
        # is how a broken invocation reads as a clean audit for months.
        if [ "$status" = "2" ]; then
          echo "::error::assay could not run — see the output above"
          exit 2
        fi
        if [ "$status" = "1" ] && [ "${{ inputs.fail-on-findings }}" != "true" ]; then
          echo "::warning::$findings finding(s); not failing because fail-on-findings is false"
          exit 0
        fi
        exit "$status"
