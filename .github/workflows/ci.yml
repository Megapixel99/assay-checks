# A tool that audits other people's checks has to be able to answer for its own.
#
# Three gates here are not boilerplate; each is a failure this package's own detectors
# exist to catch, pointed back at the package:
#
#   1. THE TREE MUST BE CLEAN AFTERWARDS. `python/tests/mutations_assay.py` rewrites
#      files and restores them in a `finally`. If a restore is ever skipped, the run
#      still reports its tally and the damage shows up in the NEXT commit — which is
#      exactly the `no-tree-writes` property `assay runners` audits for.
#
#   2. THE PACKAGE IS SCANNED BY ITS OWN SCANNER. Merging two tools is when
#      duplication arrives, and a duplication detector that has never been pointed at
#      itself is making a claim it has not checked.
#
#   3. EVERY SUITE MUST REPORT A DENOMINATOR. `evidence` is the first of the seven
#      properties `assay runners` audits for — "no failures reported and no test
#      executed look identical" — and a green matrix above proves neither half of
#      that. So the suites are run once more under `zerocase` and `didrun`, which
#      read the count out of the run and refuse a pass that counted nothing.
#
# Action versions are pinned at v7 deliberately. Older majors still run, on a Node the
# runner silently substitutes, and a pin that is wrong for its own runtime is invisible
# in a pass/fail — you only see it in an annotation nobody reads.
name: ci

on:
  push:
    # `master` only. A branch with an open PR matches both triggers and every job runs
    # twice, and a concurrency group does NOT fix it: the push event keys on
    # `refs/heads/<branch>` while the pull_request event keys on `<branch>`, so they
    # land in different groups.
    branches: [master]
  pull_request:
  workflow_dispatch:
  # `release.yml` calls this workflow rather than copying the jobs into itself. A
  # release gate that has drifted from the suite it claims to be is worse than no
  # gate, and a copy drifts the first time a job is added here.
  workflow_call:

# The Python half lives in `python/` beside `js/`, and is still IMPORTED as `assay`.
# Nothing here installs the package — a tool that audits your build should not need a
# build of its own — so the interpreter is told where to find it once, here, instead of
# every step carrying a prefix that one of them would eventually be missing.
env:
  PYTHONPATH: python
  # The two guards, PINNED AND NAMED ONCE because two jobs below install them and a
  # second copy drifts the first time one of them is bumped. Installed globally rather
  # than written into `package.json`: this package ships `dependencies: {}` and means
  # it, and a local install would leave a `package-lock.json` in a tree the `mutations`
  # job asserts is clean.
  GUARDS: zerocase@0.1.3 @megapixel99/didrun@0.1.2

concurrency:
  # `github.workflow` is part of the key because a version-bump push matches BOTH this
  # workflow and `release.yml`, and `release.yml` calls this one. Without it both land
  # in `ci-refs/heads/master`, and `cancel-in-progress` cancels the release's own test
  # run — a gate cancelled by the push that needs it.
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor is what `pyproject.toml` claims, and the claim is checked rather
        # than trusted: `requires-python = ">=3.9"` is a promise, and a promise nothing
        # runs is the stale-documentation defect in a metadata file.
        python-version: ['3.9', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: no dependencies, and that is a design constraint
        # A quality tool that drags in a dependency tree is one more thing that can
        # break the build it was added to protect. Asserted, because `pyproject.toml`
        # saying `dependencies = []` is a claim about the code, not a check of it.
        run: |
          if python3 -c "import assay.cli, assay.sameness, assay.checks, assay.anchors" 2>&1 \
             | grep -q "ModuleNotFoundError"; then
            echo "::error::assay imported something outside the standard library"
            exit 1
          fi
          python3 -c "import assay; print('assay', assay.__version__)"

      - name: the suites
        run: python3 python/tests/run_tests.py

  javascript:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # `package.json` says `>=18`, and `node:test` is what the suites use.
        node-version: ['18', '22', '24']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: the suites
        run: node --test js/test/*.test.js

  evidence:
    # THE MATRICES ABOVE REPORT PASS/FAIL AND NEITHER REPORTS A COUNT. A glob that
    # stops matching, a discovery pattern that goes stale, a runner that exits before
    # it loads anything — each of those is a green check over zero tests, and it is
    # indistinguishable from a suite that passed. That is the `evidence` property this
    # package audits other people's runners for, so the suites here are run once more
    # under two guards that read the number: `zerocase` reads it out of a report,
    # `didrun` reads it out of the output.
    #
    # A SEPARATE JOB rather than a step inside the matrices, for two reasons. Both
    # guards declare `node >= 20` and the `javascript` matrix deliberately starts at
    # 18. And the questions differ: the matrices ask whether the suites run on every
    # runtime claimed, this asks whether anything ran at all, which one runtime
    # answers.
    #
    # THE FLOORS ARE ROUND AND WELL UNDER THE CURRENT COUNTS (388 JavaScript tests,
    # 409 Python) so that ADDING tests never trips a gate, and no one is tempted to
    # edit a number to make CI green. What they catch is a suite collapsing, not a
    # suite changing size.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: the guards
        run: npm install -g $GUARDS

      - name: the JavaScript suite ran tests, and a count says so
        # The TAP reporter, because `1..N` is a plan the run actually declared and
        # `zerocase` subtracts the `# SKIP`s from it — the default reporter's summary
        # is prose. The report is written to RUNNER_TEMP rather than the tree: the
        # `mutations` job asserts a clean tree afterwards, and a stray artifact reads
        # there as a mutation left applied.
        run: |
          zerocase --tap "$RUNNER_TEMP/js.tap" --min 300 -- \
            node --test --test-reporter=tap \
                 --test-reporter-destination="$RUNNER_TEMP/js.tap" js/test/*.test.js

      - name: the Python suite ran tests, and a count says so
        # `run_tests.py` prints `N tests, N failures, N errors`, and that line is
        # already load-bearing — `mutations_assay.py` reads it to decide whether a
        # suite RAN at all. Read here for its number, so a discovery pattern that
        # matches nothing cannot pass as a suite with nothing wrong with it.
        run: |
          didrun --expect-count '([0-9]+) tests, [0-9]+ failures' --min 350 -- \
            python3 python/tests/run_tests.py

  itself:
    # The package pointed at the package. Runs once; the matrices above cover portability.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # `assay diff` compares against a base ref, and the default shallow fetch
          # leaves that ref unresolvable — so this half of the audit would report
          # "cannot diff" on every run and nothing would say otherwise.
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: the two implementations agree on one contract
        # If the halves disagree about a property name or an exit code, one assay.json
        # yields different verdicts depending on which binary CI invoked.
        run: python3 -m unittest python.tests.test_parity -v

      - name: no two functions here answer the same question
        run: python3 -m assay scan python/assay

      - name: it audits itself
        # `all --scan` rather than the subcommands separately: a baseline entry with no
        # `from` is only called STALE by a run that performed every audit able to
        # produce one, and without `--scan` the sameness half is not one of them.
        run: python3 -m assay --root . all --base origin/master --scan python/assay

      - name: the JavaScript CLI answers for every command it ships
        # `anchors` used to exit 2 here and point at PyPI, and this step asserted the
        # refusal. It reads the mutation table by IMPORT now, so what is checked is
        # that the command RUNS — and that the refusal text is gone, because
        # documentation that is wrong in the direction people act on is worse than
        # none.
        run: |
          node js/src/cli.js --version
          node js/src/cli.js scan js/src
          node js/src/cli.js --root . anchors > /tmp/anchors.txt 2>&1
          cat /tmp/anchors.txt
          if grep -q "Python package only" /tmp/anchors.txt; then
            echo "::error::the CLI still refuses a command it now implements"
            exit 1
          fi

  mutations:
    # Every guard in BOTH halves broken in turn, each declaring the test that must go
    # red. A `.js` mutation runs the Node suite and a `.py` one runs the Python suite:
    # a Python test cannot observe a JavaScript guard, so scoring one against the other
    # would be a tally over a suite that was never going to see it.
    # Separate job so the fast feedback above is never held up behind it.
    runs-on: ubuntu-latest
    # THE COST IS (mutations × suite), PER HALF. Every mutation runs a whole suite from
    # scratch, so the wall clock is 139 Python mutations plus 112 JavaScript ones, each
    # paying its half's suite in full.
    #
    # THE 28 MINUTES THIS ONCE REPORTED WAS MEASURED AT 182 MUTATIONS, and that is the
    # last time anyone timed the whole table. It is 251 now, so 28 is a floor and not an
    # estimate, and the honest reading of the gap is that nobody has re-measured it —
    # which is why the timeout is set off the failure mode rather than off this number.
    # (At 182 it was 93 minutes before the probe stopped importing `asyncio` on every
    # spawn and the Python suite started running its classes in parallel.)
    #
    # Raised rather than sampled. A `--only` filter exists and prints PARTIAL RUN when
    # it is used, because a tally over the mutations you had time for reads exactly
    # like a tally over all of them — which is the defect this package exists to
    # report. The number is generous on purpose: a timeout KILLS the runner, SIGKILL
    # does not run `finally`, and being cut off is the one way this job can leave the
    # tree mutated. The step below is what says so when it happens.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      # BOTH runtimes, because the runner now mutates `js/src` too and scores those
      # against `node --test`. Without this the JavaScript mutations run on whatever
      # node the image happens to carry, or on none — and a suite that cannot start
      # reports DID NOT RUN, which this runner refuses to score rather than counting
      # as a catch. Pinned to the same major the `javascript` matrix ends on.
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: the guards
        run: npm install -g $GUARDS

      - name: every guard, broken in turn
        # Wrapped because the one number this job exists to produce is the one a
        # `--only` filter, a truncated table, or a bad `--root` would quietly shrink:
        # `3/3 mutations detected` and `251/251 mutations detected` are both a clean
        # sweep and both exit 0. The floor reads the DENOMINATOR — how many mutations
        # were SCORED, not how many were caught — so a run over a handful fails here
        # even when every one of the handful was caught. PARTIAL RUN says so in the
        # output too; this is the part that says so in the exit code.
        run: |
          didrun --expect-count '[0-9]+/([0-9]+) mutations detected' --min 200 -- \
            python3 python/tests/mutations_assay.py

      - name: no target left mutated
        # The runner restores in a `finally` and turns SIGTERM into an exception,
        # because SIGTERM does not run `finally`. This is the check that says so.
        if: always()
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::a mutation was left applied — the restore did not run"
            git status --porcelain
            git diff | head -80
            exit 1
          fi
          echo "every target restored"
